<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EAP | BO 元数据编辑器</title>
<link rel="stylesheet" href="css/shared.css">
<link rel="stylesheet" href="css/metadata-editor.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-badge">EA</span>
    <span>EAP | 元数据编辑器</span>
  </div>

  <div class="meta-tabs" id="meta-tabs"><!-- rendered by JS --></div>

  <div class="header-spacer"></div>

  <div class="file-ops">
    <button class="btn" onclick="document.getElementById('file-open-input').click()">📂 打开文件</button>
    <button class="btn" onclick="newDoc()">📄 新建</button>
    <button class="btn btn-success" onclick="saveToServer()">💾 保存到项目</button>
    <button class="btn" onclick="downloadDoc()">⬇ 下载文件</button>
    <input type="file" id="file-open-input" accept=".json" onchange="openFile(event)">
  </div>
</header>

<!-- 新建 BO 弹框 -->
<div id="new-bo-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-header">
      <h3>📄 新建业务对象</h3>
      <button class="modal-close-btn" onclick="closeNewBoModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-field">
        <label>BO 标识 <span style="color:var(--danger)">*</span></label>
        <input id="new-boCode" type="text" placeholder="名词复数 kebab-case，如 opportunities" style="font-family:monospace">
        <span class="hint">建议用英文名词复数形式，如 opportunities / competitors / products。一经创建请勿修改</span>
      </div>
      <div class="modal-field">
        <label>BO 名称 <span style="color:var(--danger)">*</span></label>
        <input id="new-boName" type="text" placeholder="如：商机">
      </div>
      <div style="display:flex;gap:10px">
        <div class="modal-field" style="flex:1">
          <label>租户标识</label>
          <input id="new-tenantId" type="text" value="default">
        </div>
        <div class="modal-field" style="flex:1">
          <label>应用代码</label>
          <input id="new-appCode" type="text" value="government">
        </div>
      </div>
      <div class="modal-field">
        <label>描述</label>
        <input id="new-description" type="text" placeholder="简要描述该业务对象的用途">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeNewBoModal()">取消</button>
      <button class="btn btn-primary" onclick="createNewBo()">✅ 创建并编辑</button>
    </div>
  </div>
</div>

<!-- 通用选择弹窗（规则/视图/操作等） -->
<div id="picker-modal" class="modal-overlay hidden">
  <div class="modal-box" style="width:900px;max-width:95vw">
    <div class="modal-header">
      <h3 id="picker-modal-title" style="font-size:14px;font-weight:600">选择配置项</h3>
      <button class="modal-close-btn" onclick="closePickerModal()">✕</button>
    </div>
    <div class="modal-body" style="padding:0;flex-direction:row;height:55vh;overflow:hidden">
      <div style="width:300px;flex-shrink:0;overflow-y:auto;background:var(--bg-base);border-right:1px solid var(--border-strong);padding:8px 0" id="picker-tree"></div>
      <div style="flex:1;overflow-y:auto;padding:14px" id="picker-detail"></div>
    </div>
    <div class="modal-footer">
      <span style="font-size:11px;color:var(--text-tertiary);margin-right:auto" id="picker-selected-count">已选 0 项</span>
      <button class="btn" onclick="closePickerModal()">取消</button>
      <button class="btn btn-primary" onclick="confirmPicker()">确认添加</button>
    </div>
  </div>
</div>

<!-- 视图字段选择弹窗：左树 | 中表 | 右已选 -->
<div id="view-picker-modal" class="modal-overlay hidden">
  <div class="modal-box" style="width:1100px;max-width:97vw">
    <div class="modal-header">
      <h3 style="font-size:14px;font-weight:600">🖥️ 选择字段视图</h3>
      <button class="modal-close-btn" onclick="closeViewPicker()">✕</button>
    </div>
    <div class="modal-body" style="padding:0;flex-direction:row;height:60vh;overflow:hidden">
      <!-- Left: entity tree -->
      <div style="width:180px;min-width:180px;max-width:180px;flex-shrink:0;overflow-y:auto;overflow-x:hidden;background:var(--bg-base);border-right:1px solid var(--border-strong);padding:8px 0" id="vp-tree" class="tree-scroll"></div>
      <!-- Center: field table -->
      <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border-strong)" id="vp-center">
        <div style="padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border-subtle);flex-shrink:0">
          <span style="font-size:11px;font-weight:600" id="vp-ent-label">选择实体查看字段</span>
          <label style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary);cursor:pointer">
            <input type="checkbox" id="vp-include-children" checked onchange="buildViewPickerTable()"> 下级实体
          </label>
          <label style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-secondary);cursor:pointer">
            <input type="checkbox" id="vp-show-configured" onchange="buildViewPickerTable()"> 已配置
          </label>
        </div>
        <div style="flex:1;overflow-y:auto;padding:4px 0" id="vp-table"></div>
      </div>
      <!-- Right: selected fields -->
      <div style="width:260px;flex-shrink:0;display:flex;flex-direction:column;background:var(--bg-base)">
        <div style="padding:8px 12px;border-bottom:1px solid var(--border-subtle);font-size:11px;font-weight:600;flex-shrink:0">已选字段 <span id="vp-sel-count" style="color:var(--accent)">0</span></div>
        <div style="flex:1;overflow-y:auto;padding:4px 0" id="vp-selected"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeViewPicker()">取消</button>
      <button class="btn btn-primary" onclick="confirmViewPicker()">确认添加</button>
    </div>
  </div>
</div>

<div class="app-workspace">
  <div class="form-panel" id="form-panel">
    <div class="form-inner" id="form-root"><!-- rendered by JS --></div>
  </div>
  <div class="resize-handle collapsed" id="resize-handle" onclick="togglePreview()" title="展开 JSON 预览"></div>
  <div class="preview-panel collapsed" id="preview-panel">
    <div class="preview-header">
      <span class="preview-title">📋 JSON 实时预览</span>
      <div class="preview-actions">
        <button class="btn-xs" onclick="copyJson()">📋 复制</button>
        <button class="btn-xs" onclick="downloadDoc()">⬇ 下载</button>
      </div>
    </div>
    <pre id="json-preview"></pre>
  </div>
</div>

<footer class="app-footer">
  <div id="status-left">EAP Metadata Editor — 信封信息由 bo-info.json 统一管理，content.boCode 自动同步</div>
  <div id="status-msg">就绪</div>
</footer>


<script src="js/shared-dicts.js"></script>
<script src="js/metadata-editor-core.js"></script>
<script src="js/metadata-editor-renderers.js"></script>
<script src="js/metadata-editor-ui.js"></script>
</body>
</html>
